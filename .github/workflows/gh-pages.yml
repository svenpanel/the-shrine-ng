name: build and deploy artifact to gh-pages branch

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile
      # generates .output/public and asserts on it
      - run: yarn run test

      - name: create .well-known folder
        run: mkdir -p ./.output/public/.well-known
      - run: echo '${{ secrets.BRAVE_REWARDS_VERIFICATION }}' > ./.output/public/.well-known/brave-rewards-verification.txt

      - run: echo '${{ secrets.GOOGLE_SITE_VERIFICATION_CONTENT }}' > './.output/public/${{ secrets.GOOGLE_SITE_VERIFICATION_FILE_NAME }}'

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.output/public
          cname: theshrine.pw
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
